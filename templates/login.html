{% extends "base.html" %}
{% block title %}Log in — Habitgrid{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="auth-panel">
    <div class="auth-brand">
      <span class="brand-mark large">◈</span>
      <h1>Habitgrid</h1>
      <p>Build streaks. See the pattern. Keep going.</p>
    </div>

    <div class="auth-card">
      <h2>Welcome back</h2>
      <p class="auth-sub">Log in to see today's progress.</p>

      <form method="POST" class="auth-form">
        <label for="username">Username or email</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <p class="auth-switch">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
